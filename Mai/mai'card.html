<!DOCTYPE html>
<html>
<head>
<title>Info flip Card</title>
<style>

.flip-card {
  background-color: transparent;
  width: 300px;
  height: 200px;
  border: 1px solid #f1f1f1;
  perspective: 1000px; 
  
}

.flip-card-inner {
  position: relative;
  width: 100%;
  height: 100%;
  text-align: center;
  transition: transform 0.8s;
  transform-style: preserve-3d;
  P
}

.flip-card:hover .flip-card-inner 
  transform: rotateY(180deg);
}

.flip-card-front, .flip-card-back {
  position: absolute;
  width: 100%;
  height: 100%;
  -webkit-backface-visibility: hidden; 
  backface-visibility: hidden;
}

.flip-card-front {
  background-color: #bbb;
  color: black;
  
}


.flip-card-back {
  background-color: rgb(194, 120, 244);
  color: white;
  transform: rotateY(180deg);
}
.dark-mode{
  background-color: black;
  color: white;
}
.dark-mode .flip-card {
  border-color: #666;
}
.dark-mode .flip-card-front {
  background-color: #222;
  color: white;
}
.dark-mode .flip-card-back {
  background-color: #444;
  color: white;
}
button {
  margin-bottom: 10px;
}
</style>
</head>

<body>
<div class="flip-card">
<button onclick="myFunction()">Toggle dark mode</button>
<p id="demo1"></p>
<p id="demo2"></p>
<p id="demo3"></p>
  <div class="flip-card-inner">
    <div class="flip-card-front">
      <h1>Front</h1>
    </div>
    <div class="flip-card-back">
      <h1 id="demo1">Mai Amr</h1>
      <p id="demo2">computer science student @ nile uni</p>
      <p id="demo3">Senior1</p>
    </div>
  </div>
</div>

<script>
  function myFunction() {
  document.body.classList.toggle("dark-mode");
}
</script>

</body>
</html>
