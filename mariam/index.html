<!DOCTYPE html>
<html>
<head>
    <title>Mariam Ashraf</title>
    <style>
        body {
            background-color: white;
            color: black;
        }

        .card {
            width: 245px;
            height: 150px;
            perspective: 1000px;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: 0.6s;
            transform-style: preserve-3d;
        }

        .card:hover .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            width: 100%;
            height: 100%;
            position: absolute;
            backface-visibility: hidden;
            background-color: lightblue;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .dark-mode {
            background-color: #333333;
            color: white;
        }

        .dark-mode .card-front, .dark-mode .card-back {
            background-color: #555555;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-inner">
            <div class="card-front">
                <h1 id="name"></h1>
                <p id="age"></p>
                <p id="major"></p>
            </div>
            <div class="card-back">
                <p id= "meeting"></p>
            </div>
        </div>
    </div>

    <br>

    <button onclick="document.body.classList.toggle('dark-mode')">Dark Mode</button>
    <script src="script.js"></script>
</body>
</html>
